<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layers · Ear Training · Evenant</title>
<meta name="description" content="Take a real passage apart: drag each instrument into the job it is doing — melody, countermelody or harmony.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dojo-base.css">
<link rel="stylesheet" href="layers.css">
<link rel="stylesheet" href="../evenant-nav.css">
</head>
<body>
<div class="atl atl-dojo" id="atl">
  <div class="atl-grain"></div>
  <div class="atl-atmos"></div>

  <nav class="atl-nav is-sub ev-bar" id="atl-nav">
    <div class="atl-nav-left">
      <div data-ev-switch data-ev-home="index.html"></div>
      <div class="atl-nav-sep"></div>
      <div class="atl-nav-crumb">
        <div class="atl-crumb"><a href="index.html">Modes</a><i>/</i><span>Layers</span></div>
      </div>
    </div>
    <div class="atl-nav-right">
      <div class="dj-score" id="ly-score" aria-live="off"></div>
    </div>
  </nav>

  <main class="atl-main">
    <div class="ly-col">
      <div class="dj-eyebrow" id="ly-eyebrow"></div>
      <h1 class="dj-display" id="ly-display"></h1>

      <button class="dj-play" id="ly-play" aria-label="Play the passage">
        <span class="ico" aria-hidden="true"></span><span id="ly-play-lbl">Play</span>
      </button>
      <div class="dj-note" id="ly-note"></div>

      <!-- The unplaced instruments. Cards carry the atlas thumbnail and name so
           an instrument looks the same here as it does on a family page. -->
      <div class="ly-tray" id="ly-tray" role="group" aria-label="Instruments to place"></div>

      <div class="ly-zones" id="ly-zones"></div>

      <div class="ly-actions" id="ly-actions"></div>
    </div>
  </main>
</div>

<script defer src="../evenant-modules.js" data-module="dojo"></script>
<script defer src="../evenant-nav.js"></script>
<script defer src="../atlas-data.js"></script>
<script defer src="audio.js"></script>
<script defer src="themes.js"></script>
<script defer src="layers-data.js"></script>
<script defer src="layers.js"></script>
</body>
</html>
