<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belts · Ear Training · Evenant</title>
<meta name="description" content="Ear training for orchestration: hear an instrument, name it, and when you are wrong, hear the two side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dojo-base.css">
<link rel="stylesheet" href="dojo.css">
<link rel="stylesheet" href="../evenant-nav.css">
</head>
<body>
<div class="atl atl-dojo" id="atl">
  <div class="atl-grain"></div>
  <div class="atl-atmos"></div>

  <nav class="atl-nav is-sub ev-bar" id="atl-nav">
    <div class="atl-nav-left">
      <div data-ev-switch data-ev-home="index.html"></div>
    </div>
    <div class="atl-nav-right">
      <div class="dj-score" id="dj-score" aria-live="off"></div>
    </div>
  </nav>

  <!-- One centred column, anchored a fixed distance from the top rather than
       vertically centred: the card grows when an answer is revealed, and a
       centred column would slide the whole question up the screen every time. -->
  <main class="atl-main">
    <div class="dj-col">
      <div class="dj-eyebrow" id="dj-belt"></div>
      <h1 class="dj-display" id="dj-display"></h1>

      <button class="dj-play" id="dj-play" aria-label="Play the clip">
        <span class="ico" aria-hidden="true"></span><span id="dj-play-lbl">Play</span>
      </button>
      <div class="dj-meter" aria-hidden="true"><i id="dj-bar-fill"></i></div>
      <div class="dj-note" id="dj-note"></div>

      <div class="dj-options" id="dj-options" role="group" aria-label="Answers"></div>
      <div class="dj-result" id="dj-result" aria-live="polite"></div>

      <button class="dj-reset" id="dj-reset">Reset progress</button>
    </div>
  </main>

</div>

<!-- atlas-data.js first: INSTRUMENTS supplies the names, families, epithets and
     the deep links back into the atlas, so the dojo can never drift out of step
     with the reference it is practising. Then the dojo's own data, then the
     renderer. All deferred, in dependency order, never async. -->
<script defer src="../evenant-modules.js" data-module="dojo"></script>
<script defer src="../evenant-nav.js"></script>
<script defer src="../atlas-data.js"></script>
<script defer src="dojo-data.js"></script>
<script defer src="dojo.js"></script>
</body>
</html>
