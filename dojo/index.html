  <main class="atl-main">
    <div class="atl-wrap">

      <!-- Belt rail. Belt 2 is the only one built; the rest are shown so the
           ladder is legible, and are marked as not yet available rather than
           looking like something the learner has failed to unlock. -->
      <div class="dj-head">
        <div>
          <div class="atl-eyebrow">The Dojo · Ear Training</div>
          <h1 id="dj-title">Instruments</h1>
          <p class="dj-lede" id="dj-lede"></p>
        </div>
        <div class="dj-rail" id="dj-rail" role="tablist" aria-label="Belts"></div>
      </div>

      <!-- The practice card. Nothing is fetched until the play button below is
           pressed: no audio, no AudioContext, nothing. -->
      <section class="dj-card" aria-labelledby="dj-ask">
        <div class="dj-ask-row">
          <h2 class="dj-ask" id="dj-ask"></h2>
          <div class="dj-streak" id="dj-streak"></div>
        </div>

        <div class="dj-stage">
          <button class="dj-play" id="dj-play" aria-label="Play the clip">
            <span class="ico" aria-hidden="true"></span>
            <span class="lbl" id="dj-play-lbl">Play</span>
          </button>
          <div class="dj-stage-meta">
            <div class="dj-bar" id="dj-bar"><i id="dj-bar-fill"></i></div>
            <div class="dj-hint" id="dj-hint">Nothing is loaded until you press play. Replay as often as you like — there is no timer.</div>
          </div>
        </div>

        <div class="dj-options" id="dj-options" role="group" aria-label="Answers"></div>

        <div class="dj-result" id="dj-result" aria-live="polite"></div>
      </section>

      <p class="dj-fine" id="dj-fine"></p>

    </div>
  </main>
</div>

<!-- atlas-data.js first: INSTRUMENTS supplies the names, families, epithets and
     the deep links back into the atlas, so the dojo can never drift out of step
     with the reference it is practising. Then the dojo's own data, then the
     renderer. All deferred, in dependency order, never async. -->
<script defer src="../atlas-data.js"></script>
<script defer src="dojo-data.js"></script>
<script defer src="dojo.js"></script>
