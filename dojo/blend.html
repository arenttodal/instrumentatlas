<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend · Ear Training · Evenant</title>
<meta name="description" content="Hear what a doubling does to a colour: the horn has the tune, and something is doubling it an octave above or below — or nothing is.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dojo-base.css">
<link rel="stylesheet" href="blend.css">
<link rel="stylesheet" href="../evenant-nav.css">
</head>
<body>
<div class="atl atl-dojo" id="atl">
  <div class="atl-grain"></div>
  <div class="atl-atmos"></div>

  <nav class="atl-nav is-sub ev-bar" id="atl-nav">
    <div class="atl-nav-left">
      <div data-ev-switch data-ev-home="index.html"></div>
      <div class="atl-nav-sep"></div>
      <div class="atl-nav-crumb">
        <div class="atl-crumb"><a href="index.html">Modes</a><i>/</i><span>Blend</span></div>
      </div>
    </div>
    <div class="atl-nav-right">
      <div class="dj-score" id="bl-score" aria-live="off"></div>
    </div>
  </nav>

  <main class="atl-main">
    <div class="bl-col">
      <div class="dj-eyebrow" id="bl-eyebrow"></div>
      <h1 class="dj-display" id="bl-display"></h1>

      <!-- The scoring of the question: which horn section, and how heavy the
           cello is when it is in. Shown after you answer, never before. -->
      <div class="bl-scoring" id="bl-scoring"></div>
      <div class="bl-detail" id="bl-detail"></div>

      <button class="dj-play" id="bl-play" aria-label="Play the passage">
        <span class="ico" aria-hidden="true"></span><span id="bl-play-lbl">Play</span>
      </button>
      <div class="dj-meter" id="bl-meter" aria-hidden="true"><i id="bl-fill"></i></div>

      <div class="dj-options" id="bl-options" role="group" aria-label="Answers"></div>
      <div class="dj-result" id="bl-result" aria-live="polite"></div>
    </div>
  </main>
</div>

<script defer src="../evenant-modules.js" data-module="dojo"></script>
<script defer src="../evenant-nav.js"></script>
<script defer src="../atlas-data.js"></script>
<script defer src="audio.js"></script>
<script defer src="blend-data.js"></script>
<script defer src="blend.js"></script>
</body>
</html>
