<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend · Ear Training · Evenant</title>
<meta name="description" content="Which instruments do you hear? Pick them out of the orchestra, and at the hardest level say where each one sits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dojo-base.css">
<link rel="stylesheet" href="blend.css">
<link rel="stylesheet" href="../evenant-nav.css">
</head>
<body>
<div class="atl atl-dojo" id="atl">
  <div class="atl-grain"></div>
  <div class="atl-atmos"></div>

  <nav class="atl-nav is-sub ev-bar" id="atl-nav">
    <div class="atl-nav-left">
      <div data-ev-switch data-ev-home="index.html"></div>
      <div class="atl-nav-sep"></div>
      <div class="atl-nav-crumb">
        <div class="atl-crumb"><a href="index.html">Modes</a><i>/</i><span>Blend</span></div>
      </div>
    </div>
    <div class="atl-nav-right">
      <div class="dj-score" id="bl-score" aria-live="off"></div>
      <!-- The level selector sits where Browse instruments sits in the atlas:
           same pill, same chevron, same menu surface as the module switcher. -->
      <div class="bl-level" id="bl-level" data-open="0">
        <button class="atl-select-btn" id="bl-level-btn" aria-haspopup="menu"
                aria-expanded="false" aria-controls="bl-level-menu">
          <span id="bl-level-label">Orchestra</span>
          <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <div class="ev-menu" id="bl-level-menu" role="menu" aria-labelledby="bl-level-btn" hidden></div>
      </div>
    </div>
  </nav>

  <main class="atl-main">
    <div class="bl-col">
      <div class="dj-eyebrow" id="bl-eyebrow"></div>
      <h1 class="dj-display" id="bl-display"></h1>

      <button class="dj-play" id="bl-play" aria-label="Play the passage">
        <span class="ico" aria-hidden="true"></span><span id="bl-play-lbl">Play</span>
      </button>
      <div class="dj-meter" id="bl-meter" aria-hidden="true"><i id="bl-fill"></i></div>
      <div class="bl-count" id="bl-count"></div>

      <!-- What you have chosen, lifted out of the grid. At level 3 this is
           three rows instead of one band. Its height is reserved so the grid
           below does not jump when the first card lands. -->
      <div class="bl-heard" id="bl-heard" role="group" aria-label="What you hear"></div>

      <!-- The candidates, grouped by family, in the family's own colour. -->
      <div class="bl-pool" id="bl-pool" role="group" aria-label="Instruments"></div>

      <div class="bl-ab" id="bl-ab" aria-live="polite"></div>
      <div class="bl-actions" id="bl-actions"></div>
      <p class="bl-note is-ghost" id="bl-note">&nbsp;</p>
    </div>
  </main>
</div>

<script defer src="../evenant-modules.js" data-module="dojo"></script>
<script defer src="../evenant-nav.js"></script>
<script defer src="../atlas-data.js"></script>
<script defer src="audio.js"></script>
<script defer src="themes.js"></script>
<script defer src="dojo-data.js"></script>
<script defer src="blend-data.js"></script>
<script defer src="blend.js"></script>
</body>
</html>
