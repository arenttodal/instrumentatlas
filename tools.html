<style>
/* ============================================================================
   ALL TOOLS
   ----------------------------------------------------------------------------
   The switcher's hub. Design system from HANDOFF §2; the card treatment is the
   atlas's — 1px hairline, near-transparent fill, warming to gold on hover.

   It exists to get you into a tool and nowhere else. No marketing, no account,
   no resource library. Direct links to a tool still open that tool: nothing
   routes through here.
   ============================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080C14;--gold:#D4A04A;--gold-lift:#DEB05A;--text:#BEC0C8;--dim:#7E808A;
  --faint:#4E505A;--hair:rgba(255,255,255,.07);--hair-gold:rgba(212,160,74,.24)}
html{background:var(--bg);overflow-y:scroll;scrollbar-gutter:stable}
body{font-family:'DM Sans',-apple-system,sans-serif;font-size:17px;line-height:1.7;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  min-height:100vh;position:relative;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:#fff;letter-spacing:-.4px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}

.grain{position:fixed;inset:-50%;width:200%;height:200%;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E")}
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% -10%,rgba(30,80,160,.20) 0%,transparent 55%),
             radial-gradient(ellipse at 85% 25%,rgba(74,140,212,.08) 0%,transparent 45%),
             radial-gradient(ellipse at 10% 70%,rgba(20,50,120,.10) 0%,transparent 45%)}

.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:15px;
  padding:14px 32px;background:rgba(8,12,20,.86);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.logo{height:15px;width:auto;display:block;object-fit:contain}
.nav-div{width:1px;height:20px;background:var(--hair)}

main{position:relative;z-index:10;max-width:1080px;margin:0 auto;padding:56px 32px 72px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(32px,4.4vw,46px);line-height:1.1;margin:10px 0 8px}
.lede{font-size:16px;color:var(--dim);font-weight:300;max-width:60ch;margin-bottom:40px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;padding:24px 24px 22px;
  border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.02);
  transition:border-color .25s,background .25s,transform .25s}
a.card:hover{border-color:var(--hair-gold);background:rgba(212,160,74,.05);transform:translateY(-2px)}
.card-head{display:flex;align-items:center;gap:12px}
.card-head svg{width:18px;height:18px;flex:0 0 auto;color:var(--gold)}
.card-head b{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:21px;color:#fff}
.card p{font-size:14px;color:var(--dim);font-weight:300;line-height:1.6;flex:1 1 auto}
.card .go{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
  letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);transition:color .25s}
a.card:hover .go{color:var(--gold)}
.card[data-soon] {opacity:.55}
.card[data-soon] .go{color:var(--faint)}
.here{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--hair-gold);border-radius:100px;padding:3px 9px}

@media (max-width:760px){
  main{padding:36px 20px 56px}
  .nav{padding:12px 20px}
  .grid{grid-template-columns:1fr}
  .card{padding:20px}
}
@media (prefers-reduced-motion:reduce){ a.card:hover{transform:none} }
</style>
</head>
