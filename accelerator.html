<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Accelerator : Evenant</title>
<meta name="description" content="An interactive companion to the Cinematic Music Accelerator. Every concept demonstrated before it is explained.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="evenant-gate.css">
<!-- Held back until the code is typed. This line runs before anything paints,
     which the gate's own deferred script cannot; see evenant-gate.js, and note
     what it says about this being a curtain rather than a lock. -->
<script>document.documentElement.dataset.gate = 'locked';</script>
<link rel="stylesheet" href="accelerator/accelerator.css">
<link rel="stylesheet" href="evenant-nav.css">
</head>
<body>
<div class="grain"></div>
<div class="atmos"></div>

<nav class="nav ev-bar">
  <div class="nav-l">
    <!-- The hand-drawn three-bar mark is gone: every tool shows the same Evenant
         logo, drawn by evenant-nav.js, and it keeps this module's #/foundations
         destination. -->
    <div data-ev-switch data-ev-home="#/foundations"></div>
    <i>/</i><span id="nav-where">Foundations</span>
  </div>
  <div class="prog">
    <span id="prog-txt">0 of 12</span>
    <span class="prog-bar"><i id="prog-fill"></i></span>
  </div>
</nav>

<main id="view"></main>

<script defer src="evenant-modules.js" data-module="accelerator"></script>
<script defer src="evenant-gate.js" data-gate="accelerator" data-gate-hash="g3j74oa"
        data-gate-name="The Accelerator"></script>
<script defer src="evenant-nav.js"></script>
<script defer src="accelerator/data.js"></script>
<script defer src="accelerator/model.js"></script>
<script defer src="accelerator/audio.js"></script>
<script defer src="accelerator/activities.js"></script>
<script defer src="accelerator/widgets.js"></script>
<script defer src="accelerator/app.js"></script>
</body>
</html>
