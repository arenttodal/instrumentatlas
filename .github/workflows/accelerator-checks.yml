name: Accelerator checks
on:
  pull_request:
    paths:
      - accelerator.html
      - accelerator/**
      - .github/workflows/accelerator-checks.yml
permissions:
  contents: read
jobs:
  accelerator:
    # PINNED, NOT ubuntu-latest, for the same reason theory-lab-checks.yml is:
    # GitHub moved ubuntu-latest to 26.04 and Playwright 1.55.0 refuses to
    # install chromium there — "ERROR: Playwright does not support chromium on
    # ubuntu26.04-x64". The runner and the Playwright pin move together or
    # neither does.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node accelerator/tests/model.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/accelerator-server.log 2>&1 &
          node accelerator/tests/browser.cjs
