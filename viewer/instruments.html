<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument Viewer · Evenant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080C14; --gold:#D4A04A; --gold-deep:#C08830; --blue:#4A8CD4;
  --text:#BEC0C8; --dim:#7E808A; --hair:rgba(255,255,255,.08); --hair-gold:rgba(212,160,74,.28);
}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'DM Sans',-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:#fff}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}

#stage{position:fixed;inset:0}
#canvas-wrap{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ambience */
.atmos{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% -10%,rgba(30,80,160,.20) 0%,transparent 55%),
             radial-gradient(ellipse at 12% 80%,rgba(20,50,120,.12) 0%,transparent 45%)}

/* ---------- chrome ---------- */
.bar{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;
  justify-content:space-between;gap:20px;padding:16px 22px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font-family:'Playfair Display',serif;font-size:17px;color:#fff;font-weight:500}
.brand span{font-size:9.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim)}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{padding:7px 15px;border:1px solid var(--hair);border-radius:100px;font-size:12px;
  color:var(--dim);transition:all .25s ease;white-space:nowrap}
.picker button:hover{border-color:var(--hair-gold);color:#fff}
.picker button[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,160,74,.12);color:#fff}

/* ---------- hotspot markers ---------- */
#markers{position:absolute;inset:0;z-index:10;pointer-events:none}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:1.5px solid var(--gold);pointer-events:auto;cursor:pointer;background:rgba(212,160,74,.10);
  transition:transform .22s cubic-bezier(.16,1,.3,1),background .22s,opacity .3s,border-color .22s;
  display:flex;align-items:center;justify-content:center}
.mk::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);transition:transform .22s}
.mk:hover,.mk.on{transform:scale(1.32);background:rgba(212,160,74,.26);box-shadow:0 0 0 5px rgba(212,160,74,.10)}
.mk.behind{opacity:.16;pointer-events:none}
.mk .lbl{position:absolute;left:32px;white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .22s;pointer-events:none;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
.mk:hover .lbl,.mk.on .lbl{opacity:1}

/* ---------- info panel ---------- */
.panel{position:absolute;top:50%;right:26px;transform:translateY(-50%) translateX(16px);width:340px;z-index:30;
  background:rgba(9,13,22,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--hair);border-radius:14px;padding:22px 22px 20px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;visibility:hidden;
  transition:opacity .3s ease,transform .35s cubic-bezier(.16,1,.3,1),visibility .3s}
.panel.open{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0)}
.panel .eyebrow{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.panel h2{font-size:22px;line-height:1.2;margin:8px 0 12px}
.panel p{font-size:14.5px;line-height:1.62;color:var(--text);font-weight:300}
.panel .close{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--hair);color:var(--dim);font-size:15px;line-height:1;display:flex;
  align-items:center;justify-content:center;transition:all .22s}
.panel .close:hover{color:var(--gold);border-color:var(--hair-gold)}
.panel .rel{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:7px}
.panel .rel span{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);
  width:100%;margin-bottom:2px}
.panel .rel button{padding:6px 12px;border:1px solid var(--hair);border-radius:100px;font-size:12px;
  color:var(--text);transition:all .22s}
.panel .rel button:hover{border-color:var(--hair-gold);color:var(--gold)}

/* ---------- footer ---------- */
.foot{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;
  justify-content:space-between;gap:20px;padding:16px 22px;pointer-events:none}
.foot > *{pointer-events:auto}
.hint{font-size:11px;color:#4E505A;line-height:1.6}
.hint kbd{font-family:inherit;font-size:10px;padding:1px 5px;border:1px solid var(--hair);border-radius:3px;color:var(--dim)}
.credit{font-size:10.5px;color:#43454F;line-height:1.6;text-align:right;max-width:330px}
.credit a{color:#6E707A;border-bottom:1px solid rgba(255,255,255,.12)}
.credit a:hover{color:var(--gold)}

/* ---------- loader / fallback ---------- */
.load{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:var(--bg);transition:opacity .5s ease}
.load.gone{opacity:0;pointer-events:none}
.load .nm{font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:var(--gold)}
.load .track{width:180px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.load .fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .3s ease}
.load .pct{font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:700}
.fallback{position:absolute;inset:0;z-index:50;display:none;overflow:auto;padding:60px 24px;background:var(--bg)}
.fallback.show{display:block}
.fallback .inner{max-width:680px;margin:0 auto}
.fallback h2{font-size:28px;margin-bottom:10px}
.fallback .note{color:var(--dim);font-size:14px;margin-bottom:28px}
.fallback article{padding:16px 0;border-top:1px solid var(--hair)}
.fallback article h3{font-size:17px;margin-bottom:6px}
.fallback article p{font-size:14px;line-height:1.6;color:var(--text);font-weight:300}

/* ---------- embed mode (?embed=1) ----------
   Used when the viewer is iframed inside a plate on an instrument page. The
   host page already carries the title, the instrument name and its own
   background, so the viewer drops all of its chrome except the CC BY credit
   and lets the host's background show through. */
html.embed,html.embed body{background:transparent}
html.embed .bar,html.embed .atmos,html.embed .hint{display:none}
html.embed .load,html.embed .fallback{background:transparent}
html.embed .foot{padding:12px 14px;justify-content:flex-end}
/* The credit is hidden HERE ONLY because the host page prints the full CC BY
   attribution: title, author, Sketchfab source, licence and modification,
   in the plate caption directly beneath this frame. Standalone /viewer/ keeps
   its own credit, and it must: without the host caption this frame would carry
   no attribution at all. Do not reuse embed=1 anywhere the caption is absent. */
html.embed .credit{display:none}

@media (max-width:820px){
  .panel{top:auto;bottom:0;right:0;left:0;width:auto;transform:translateY(20px);border-radius:14px 14px 0 0;
    max-height:52vh;overflow:auto}
  .panel.open{transform:translateY(0)}
  .bar{padding:12px 14px;flex-direction:column;align-items:flex-start;gap:10px}
  .picker button{padding:6px 12px;font-size:11px}
  .foot{padding:12px 14px}
  .hint{display:none}
  .credit{max-width:60vw;font-size:9.5px}
  .mk .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
<script>
/* Set before first paint so an embedded viewer never flashes its own
   background or chrome before the module runs. */
if(new URLSearchParams(location.search).get('embed') === '1')
  document.documentElement.classList.add('embed');
</script>

<body>

<div id="stage">
  <div id="canvas-wrap"></div>
  <div class="atmos"></div>
  <div id="markers"></div>

  <div class="bar">
    <div class="brand"><b>Instrument Viewer</b><span id="tri-count"></span></div>
    <div class="picker" id="picker"></div>
  </div>

  <aside class="panel" id="panel" role="dialog" aria-live="polite">
    <button class="close" id="panel-close" aria-label="Close">&times;</button>
    <div class="eyebrow" id="panel-eyebrow"></div>
    <h2 id="panel-title"></h2>
    <p id="panel-body"></p>
    <div class="rel" id="panel-rel"></div>
  </aside>

  <div class="foot">
    <div class="hint">Drag to rotate · scroll to zoom · click a marker<br>
      <kbd>Tab</kbd> cycle hotspots · <kbd>Esc</kbd> close</div>
    <div class="credit" id="credit"></div>
  </div>

  <div class="load" id="load">
    <div class="nm" id="load-name">Loading</div>
    <div class="track"><div class="fill" id="load-fill"></div></div>
    <div class="pct" id="load-pct">0%</div>
  </div>

  <div class="fallback" id="fallback">
    <div class="inner">
      <h2 id="fb-title"></h2>
      <p class="note">3D isn't available on this device, so here is the same material as text.</p>
      <div id="fb-body"></div>
    </div>
  </div>
</div>

<script>
/* ---- failure reporting -------------------------------------------------
   A module that fails to parse or import dies silently and the loader sits
   at "Loading" forever. Anything that goes wrong now says so on screen. */
function viewerFail(title, detail){
  var l = document.getElementById('load');
  if(!l) return;
  l.classList.remove('gone');
  document.getElementById('load-name').textContent = title;
  document.getElementById('load-pct').innerHTML = detail;
  document.getElementById('load-pct').style.cssText =
    'font-size:12px;letter-spacing:0;color:#BEC0C8;max-width:440px;text-align:center;line-height:1.6;font-weight:400';
  var t = document.querySelector('.load .track'); if(t) t.style.display = 'none';
}
window.__viewerBooted = false;
window.addEventListener('error', function(e){
  if(window.__viewerBooted) return;
  viewerFail('Script error', (e.message || 'Unknown') + '<br><span style="color:#7E808A">' + (e.filename||'') + '</span>');
});
window.addEventListener('unhandledrejection', function(e){
  if(window.__viewerBooted) return;
  viewerFail('Load failed', String(e.reason && e.reason.message || e.reason || ''));
});
/* file:// cannot fetch models or modules, so say so explicitly */
if(location.protocol === 'file:'){
  viewerFail('Needs a local server',
    'Browsers block <code>file://</code> from loading 3D models.<br><br>' +
    'In this folder run:<br><b style="color:#D4A04A">python3 -m http.server 8000</b><br>' +
    'then open <b style="color:#D4A04A">http://localhost:8000/instruments.html</b>');
}
/* nothing rendered after 12s? something is wrong. Stop pretending to load */
setTimeout(function(){
  if(!window.__viewerBooted && location.protocol !== 'file:'){
    viewerFail('Still loading…',
      'The model has not arrived. The .glb files must sit in the same folder as this page. ' +
      'Check the browser console for the failing request.');
  }
}, 12000);
</script>

<script type="module">

/* ============================================================================
   1. DATA. Instruments, materials, hotspots.
   Hotspots are POINTS IN MODEL SPACE with a radius, not geometry. Models are
   normalised at export (centred on origin, longest axis = 2.0), so every
   coordinate below sits in the same -1.0…1.0 space regardless of source model.
   Place new ones with ?author=1: click the model, paste from the console.
   rotY turns the model so its front faces the opening camera. The bowed
   strings are modelled back-to-front and need 180; the brass do not.
   ============================================================================ */

  silver: { metalness:1.0, roughness:0.14, color:0xD8D8DC },
  wood:   { metalness:0.0, roughness:0.35, color:0x8A4B24, clearcoat:0.8, clearcoatRoughness:0.15 }
};

const INSTRUMENTS = {

    hotspots:[
      {id:'scroll', label:'Scroll', pos:[0,0.47,0], radius:0.07,
       title:'Scroll and pegbox',
       body:'Decorative and functional at once: the pegbox houses the tuning pegs, and the scroll caps it. The carving style is often distinctive enough to identify a maker or a whole school of instrument building.'},
      {id:'pegs', label:'Pegs', pos:[0.03,0.42,0], radius:0.055,
       title:'Tuning pegs',
       body:'Friction-fit tapered pegs with no gearing at all, and tuned by pushing in and turning at the same time. They are coarse by design; fine tuning happens down at the tailpiece.', related:['tailpiece']},
      {id:'fingerboard', label:'Fingerboard', pos:[0,0.26,0.03], radius:0.09,
       title:'Fingerboard',
       body:'Ebony, and unfretted, so pitch is entirely the player\'s responsibility. It is curved to match the bridge so that each string can be bowed on its own without catching its neighbours.'},
      {id:'bridge', label:'Bridge', pos:[0,-0.05,0.05], radius:0.05,
       title:'Bridge',
       body:'Transmits string vibration into the top plate, and is held in place by string pressure alone, never glued. Its curvature sets both the string spacing and the clearance the bow needs to reach one string at a time.', related:['soundpost','fholes']},
      {id:'fholes', label:'f-holes', pos:[0.12,-0.04,0.045], radius:0.07,
       title:'The f-holes',
       body:'They let air move in and out of the body, and their length and placement tune the air resonance inside it. They also free the centre of the top plate to vibrate, which matters as much as the airflow.', related:['bridge']},
      {id:'soundpost', label:'Soundpost', pos:[0.03,-0.06,0], radius:0.05,
       title:'Soundpost, l\'âme',
       body:'A dowel wedged inside between top and back, just under the treble foot of the bridge. It couples the two plates, and moving it by a millimetre shifts the whole instrument brighter or darker. The French call it the soul of the instrument.', related:['bridge','bassbar']},
      {id:'bassbar', label:'Bass bar', pos:[-0.06,-0.06,0.02], radius:0.05,
       title:'Bass bar',
       body:'Glued under the bass side of the top plate. It strengthens the top against string pressure and carries low-frequency vibration along its length, spreading it across the plate.', related:['soundpost']},
      {id:'tailpiece', label:'Tailpiece', pos:[0,-0.22,0.04], radius:0.06,

       body:'Anchors the strings at the bottom end. The fine tuners here give small, controllable adjustments without going near the pegs, which is how most players tune once they are roughly in.', related:['pegs']},
      {id:'endpin', label:'Endpin', pos:[0,-0.42,0], radius:0.06,

    ]
  },

  horn: {
    name:'French horn', file:'horn.glb', material:'brass',
    target:[0,0,0], rotY:0,
    credit:'&ldquo;French Horn&rdquo; by Bethanycrandallart · <a href="https://skfb.ly/6TxEP" target="_blank" rel="noopener">Sketchfab</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · modified: decimated to 90k triangles, brass material applied',
    hotspots:[
      {id:'mouthpiece', label:'Mouthpiece', pos:[-0.35,0.12,0.05], radius:0.07,
       title:'Mouthpiece',
       body:'A deep funnel-shaped cup, quite unlike a trumpet\'s shallower bowl. That funnel is a large part of why the horn reads as dark and rounded rather than bright and direct.', related:['bore']},
      {id:'leadpipe', label:'Leadpipe', pos:[-0.22,0.06,0.04], radius:0.07,
       title:'Leadpipe',
       body:'The first tapered section after the mouthpiece. Its exact taper has a strong effect on response and on how cleanly the instrument slots onto a note, and players are particular about it.', related:['bore']},
      {id:'bore', label:'Conical bore', pos:[-0.05,0.02,0], radius:0.12,

       body:'The horn is predominantly conical, expanding gradually all the way from mouthpiece to bell. Trumpets and trombones are largely cylindrical until the bell flares. Conical bores emphasise even harmonics and read as warm and round; cylindrical bores favour odd harmonics and sound brighter and more penetrating.', related:['bell','mouthpiece']},
      {id:'valves', label:'Rotary valves', pos:[0.05,-0.10,0.02], radius:0.09,
       title:'Rotary valves',
       body:'Rotary rather than piston, as on a trumpet. Each one diverts the air through an extra length of tubing, lowering the pitch. The rotary action is quieter and smoother, which suits the horn\'s legato writing.', related:['slides','thumb']},
      {id:'slides', label:'Valve slides', pos:[0.16,-0.16,0], radius:0.08,

      {id:'thumb', label:'Thumb valve', pos:[-0.02,-0.14,0.06], radius:0.06,

  violin: {
    name:'Violin', file:'violin.glb', material:'wood',
    target:[0,0,0], rotY:180,
    credit:'&ldquo;Violin Texturing&rdquo; by ilushandro · <a href="https://skfb.ly/oAVFz" target="_blank" rel="noopener">Sketchfab</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · modified: decimated to 100k triangles, varnished-wood material applied',

       body:'Held by string tension alone. Its curve is steeper than a cello\'s relative to size, which is what lets a violinist cross strings quickly without catching the neighbouring one.', related:['soundpost']},
      {id:'fholes', label:'f-holes', pos:[0.10,-0.05,0.04], radius:0.06,
       title:'The f-holes',
       body:'Tune the air resonance of the body and free the top plate to move. Their shape is largely inherited from the Cremonese makers, and small variations are a maker\'s signature.'},
      {id:'soundpost', label:'Soundpost', pos:[0.03,-0.07,0], radius:0.045,
       title:'Soundpost',
       body:'Wedged between top and back under the treble side of the bridge. Millimetre adjustments audibly change the instrument\'s brightness, enough that players have it moved seasonally.', related:['bridge']},
      {id:'chinrest', label:'Chinrest', pos:[-0.04,-0.30,0.05], radius:0.07,
       title:'Chinrest',
       body:'Not original to the instrument: Louis Spohr added it around 1820. It lets the player hold the violin with the jaw alone, freeing the left hand to shift position rather than support the neck.'},
      {id:'tailpiece', label:'Tailpiece', pos:[0,-0.24,0.04], radius:0.05,
       title:'Tailpiece and fine tuners',
       body:'Anchors the strings and carries the fine tuners. Steel E strings in particular need one, since the pegs are far too coarse to tune them accurately.'}
    ]
  }
};

/* ============================================================================
   2. WEBGL CHECK + FALLBACK
   ============================================================================ */
function hasWebGL(){
  try { const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch(e){ return false; }
}

const params  = new URLSearchParams(location.search);
const AUTHOR  = params.get('author') === '1';
/* embedded in an instrument page: one instrument, no chrome, no picker */
const EMBED   = params.get('embed') === '1';
let current   = INSTRUMENTS[params.get('i')] ? params.get('i') : 'cello';

if(!hasWebGL()){
  const inst = INSTRUMENTS[current];
  document.getElementById('fb-title').textContent = inst.name;
  document.getElementById('fb-body').innerHTML = inst.hotspots.map(h =>
    `<article><h3>${h.title}</h3><p>${h.body}</p></article>`).join('');
  document.getElementById('fallback').classList.add('show');
  document.getElementById('load').classList.add('gone');
} else {
  boot();
}

/* ============================================================================
   3. VIEWER
   ============================================================================ */
function boot(){
const wrap = document.getElementById('canvas-wrap');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
wrap.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.01, 100);

/* RoomEnvironment generates a studio IBL procedurally, so there is no HDRI to host */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(2,3,2);
const rim = new THREE.DirectionalLight(0x8FB4E0, 1.1); rim.position.set(-2,1,-2);
const warm= new THREE.DirectionalLight(0xD4A04A, 0.5); warm.position.set(0,-1.5,1.5);
scene.add(key, rim, warm);

/* contact shadow: instruments with no shadow read as clip art */
const shadowGeo = new THREE.PlaneGeometry(2.4, 2.4);
const shadowMat = new THREE.MeshBasicMaterial({
  transparent:true, opacity:0.5, depthWrite:false,
  map:(function(){
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d').createRadialGradient(128,128,4,128,128,124);
    g.addColorStop(0,'rgba(0,0,0,.75)'); g.addColorStop(.55,'rgba(0,0,0,.22)'); g.addColorStop(1,'rgba(0,0,0,0)');
    const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  })()
});
const shadow = new THREE.Mesh(shadowGeo, shadowMat);
shadow.rotation.x = -Math.PI/2; shadow.position.y = -0.52;
scene.add(shadow);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 0.6; controls.maxDistance = 4;
controls.enablePan = false;
controls.autoRotate = !reduced; controls.autoRotateSpeed = 0.5;

const loader = new GLTFLoader();
let model = null, hotspots = [], markers = [], activeId = null;

/* Frame from the model's own bounds rather than a hand-tuned distance. The
   four .glb files are all normalised to a longest axis of 2, but their
   proportions are nothing alike: the cello is tall and narrow, the horn wide
   and deep. One fixed distance cropped the cello top and bottom while leaving
   the trumpet adrift in an empty frame. Width is measured across the diagonal
   of the footprint, so nothing clips as the model orbits. The contact shadow
   is placed on the model's actual underside for the same reason: at a fixed
   y it floated across the middle of the taller instruments. */
function frameModel(inst){
  const bb     = new THREE.Box3().setFromObject(model);
  const size   = bb.getSize(new THREE.Vector3());
  const centre = bb.getCenter(new THREE.Vector3());
  const vFov   = THREE.MathUtils.degToRad(camera.fov);
  const hFov   = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const fit    = Math.max(
    (size.y / 2) / Math.tan(vFov / 2),
    (Math.hypot(size.x, size.z) / 2) / Math.tan(hFov / 2)
  ) * (inst.zoom || 1.1);

  controls.target.copy(centre).add(new THREE.Vector3(...(inst.target || [0,0,0])));
  camera.position.copy(controls.target)
    .add(new THREE.Vector3(0.55, 0.28, 0.8).normalize().multiplyScalar(fit));
  controls.minDistance = fit * 0.3;
  controls.maxDistance = fit * 2.4;
  controls.update();

  shadow.position.y = bb.min.y - 0.02;
  const foot = Math.max(size.x, size.z) * 1.7 / 2.4;
  shadow.scale.set(foot, foot, 1);
}

/* ---------- proximity glow: highlight is distance to a point, not geometry ---------- */
const GLOW = { center:new THREE.Vector3(999,999,999), radius:0.0001, strength:0.0 };

function attachGlow(mat){
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uGlowC = { get value(){ return GLOW.center; } };
    shader.uniforms.uGlowR = { get value(){ return GLOW.radius; } };
    shader.uniforms.uGlowS = { get value(){ return GLOW.strength; } };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;')
      .replace('#include <worldpos_vertex>',
               '#include <worldpos_vertex>\nvWorldPos = (modelMatrix * vec4(transformed,1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>',
               '#include <common>\nvarying vec3 vWorldPos;\nuniform vec3 uGlowC;\nuniform float uGlowR;\nuniform float uGlowS;')
      .replace('#include <dithering_fragment>',
               `#include <dithering_fragment>
                float d = distance(vWorldPos, uGlowC);
                float g = 1.0 - smoothstep(0.0, uGlowR, d);
                gl_FragColor.rgb += vec3(0.83,0.63,0.29) * g * uGlowS * 0.85;`);
  };
  mat.needsUpdate = true;
}

/* ---------- loading ---------- */
function setProgress(p){
  document.getElementById('load-fill').style.width = (p*100).toFixed(0) + '%';
  document.getElementById('load-pct').textContent  = (p*100).toFixed(0) + '%';
}

function loadInstrument(key_){
  const inst = INSTRUMENTS[key_];
  current = key_;
  document.getElementById('load').classList.remove('gone');
  document.getElementById('load-name').textContent = inst.name;
  setProgress(0);
  closePanel();
  clearMarkers();
  if(model){ scene.remove(model); model.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());
  }); model = null; }

  loader.load(inst.file, (gltf) => {
    model = gltf.scene;
    let tris = 0;
    model.traverse(o => {
      if(!o.isMesh) return;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      if(!inst.keepMaterials && inst.material){
        const preset = MATERIALS[inst.material];
        o.material = new THREE.MeshPhysicalMaterial({
          color:preset.color, metalness:preset.metalness, roughness:preset.roughness,
          clearcoat:preset.clearcoat || 0, clearcoatRoughness:preset.clearcoatRoughness || 0,
          envMapIntensity:1.15
        });
      } else if(o.material){
        o.material.envMapIntensity = 1.1;
      }
      attachGlow(o.material);
    });
    if(inst.rotY) model.rotation.y = THREE.MathUtils.degToRad(inst.rotY);
    scene.add(model);

    hotspots = inst.hotspots;
    buildMarkers();
    document.getElementById('tri-count').textContent =
      `${inst.name} · ${Math.round(tris/1000)}k triangles`;
    document.getElementById('credit').innerHTML = inst.credit;

    frameModel(inst);

    setProgress(1);
    window.__viewerBooted = true;
    setTimeout(() => document.getElementById('load').classList.add('gone'), 220);

    const h = params.get('h');
    if(h && hotspots.find(x => x.id === h)) setTimeout(() => openHotspot(h), 500);
  },
  (e) => { if(e.total) setProgress(Math.min(e.loaded/e.total, 0.95)); },
  (err) => {
    console.error('[viewer] model load failed:', inst.file, err);
    viewerFail('Could not load ' + inst.name,
      'Missing or unreadable: <b style="color:#D4A04A">' + inst.file + '</b><br>' +
      'It must sit in the same folder as instruments.html');
  });
}

/* ---------- markers ---------- */
function clearMarkers(){
  markers.forEach(m => m.el.remove());
  markers = [];
}
function buildMarkers(){
  const layer = document.getElementById('markers');
  hotspots.forEach(h => {
    const el = document.createElement('button');
    el.className = 'mk';
    el.setAttribute('aria-label', h.title);
    el.innerHTML = `<span class="lbl">${h.label}</span>`;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); openHotspot(h.id); });
    layer.appendChild(el);
    markers.push({ el, h, v:new THREE.Vector3(...h.pos) });
  });
}

const tmp = new THREE.Vector3();
function updateMarkers(){
  markers.forEach(m => {
    tmp.copy(m.v);
    if(model) tmp.applyMatrix4(model.matrixWorld);
    const world = tmp.clone();
    tmp.project(camera);
    const x = (tmp.x * 0.5 + 0.5) * innerWidth;
    const y = (-tmp.y * 0.5 + 0.5) * innerHeight;
    m.el.style.left = x + 'px';
    m.el.style.top  = y + 'px';
    /* hide markers on the far side of the model */
    const toCam = camera.position.clone().sub(world).normalize();
    const toCtr = world.clone().sub(controls.target).normalize();
    m.el.classList.toggle('behind', toCam.dot(toCtr) < -0.05);
    m.el.style.display = tmp.z > 1 ? 'none' : 'flex';
  });
}

/* ---------- panel + camera easing ---------- */
let ease = null;
function openHotspot(id){
  const h = hotspots.find(x => x.id === id); if(!h) return;
  activeId = id;
  markers.forEach(m => m.el.classList.toggle('on', m.h.id === id));

  GLOW.center.set(...h.pos);
  if(model) GLOW.center.applyMatrix4(model.matrixWorld);
  GLOW.radius = h.radius * 2.4;
  GLOW.strength = 1.0;

  controls.autoRotate = false;
  const target = new THREE.Vector3(...h.pos);
  if(model) target.applyMatrix4(model.matrixWorld);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.max(h.radius * 9, 0.85);
  ease = { t:0, dur: reduced ? 1 : 42,
           fromT:controls.target.clone(), toT:target,
           fromP:camera.position.clone(), toP:target.clone().add(dir.multiplyScalar(dist)) };

  const p = document.getElementById('panel');
  document.getElementById('panel-eyebrow').textContent = INSTRUMENTS[current].name;
  document.getElementById('panel-title').textContent = h.title;
  document.getElementById('panel-body').textContent = h.body;
  const rel = document.getElementById('panel-rel');
  rel.innerHTML = (h.related && h.related.length)
    ? '<span>See also</span>' + h.related.map(r => {
        const t = hotspots.find(x => x.id === r);
        return t ? `<button data-go="${r}">${t.title}</button>` : ''; }).join('')
    : '';
  rel.querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => openHotspot(b.dataset.go)));
  p.classList.add('open');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  markers.forEach(m => m.el.classList.remove('on'));
  GLOW.strength = 0.0;
  activeId = null;
  if(!reduced) controls.autoRotate = true;
}

document.getElementById('panel-close').addEventListener('click', closePanel);
renderer.domElement.addEventListener('pointerdown', () => { if(activeId) closePanel(); });
addEventListener('keydown', e => {
  if(e.key === 'Escape') closePanel();
  if(e.key === 'Tab' && hotspots.length){
    e.preventDefault();
    const i = hotspots.findIndex(h => h.id === activeId);
    openHotspot(hotspots[(i + (e.shiftKey ? -1 : 1) + hotspots.length) % hotspots.length].id);
  }
});

/* ---------- instrument picker ---------- */
const picker = document.getElementById('picker');
if(!EMBED) Object.keys(INSTRUMENTS).forEach(k => {
  const b = document.createElement('button');
  b.textContent = INSTRUMENTS[k].name;
  b.setAttribute('aria-pressed', String(k === current));
  b.addEventListener('click', () => {
    [...picker.children].forEach(c => c.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    loadInstrument(k);
  });
  picker.appendChild(b);
});

/* ---------- author mode: click to print coordinates ---------- */
if(AUTHOR){
  const ray = new THREE.Raycaster(), m2 = new THREE.Vector2();
  renderer.domElement.addEventListener('dblclick', (e) => {
    m2.x = (e.clientX/innerWidth)*2 - 1;
    m2.y = -(e.clientY/innerHeight)*2 + 1;
    ray.setFromCamera(m2, camera);
    const hit = ray.intersectObject(model, true)[0];
    if(!hit) return;
    const local = model.worldToLocal(hit.point.clone());
    console.log('%c hotspot pos: ', 'background:#D4A04A;color:#000',
      `pos:[${local.x.toFixed(3)},${local.y.toFixed(3)},${local.z.toFixed(3)}], radius:0.06`);
  });
  hotspotDebug();
  function hotspotDebug(){
    console.log('%c AUTHOR MODE. Double-click the model to print a hotspot coordinate.',
      'background:#D4A04A;color:#000;padding:2px 6px');
  }
  document.querySelector('.hint').innerHTML =
    '<b style="color:#D4A04A">AUTHOR MODE</b>. Double-click the model, coordinates print to the console';
}

/* ---------- loop ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function tick(){
  requestAnimationFrame(tick);
  if(ease){
    ease.t++;
    const k = Math.min(ease.t/ease.dur, 1);
    const s = 1 - Math.pow(1-k, 3);
    controls.target.lerpVectors(ease.fromT, ease.toT, s);
    camera.position.lerpVectors(ease.fromP, ease.toP, s);
    if(k >= 1) ease = null;
  }
  controls.update();
  updateMarkers();
  renderer.render(scene, camera);
}
loadInstrument(current);
tick();

/* postMessage API so a host page can drive the viewer from lesson text */
addEventListener('message', (e) => {
  const d = e.data || {};
  if(d.type === 'showHotspot' && hotspots.find(h => h.id === d.id)) openHotspot(d.id);
  if(d.type === 'showInstrument' && INSTRUMENTS[d.id]) loadInstrument(d.id);
});
}
</script>
</body>
